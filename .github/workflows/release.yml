name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run Tests
        run: go test -v ./...

      - name: Build Cross-Platform Binaries
        run: |
          mkdir -p dist
          
          # Windows AMD64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/agentburp-windows-amd64.exe ./cmd/agentburp
          cp dist/agentburp-windows-amd64.exe dist/agentburp.exe
          
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/agentburp-linux-amd64 ./cmd/agentburp
          
          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/agentburp-linux-arm64 ./cmd/agentburp
          
          # macOS Intel (Darwin AMD64)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/agentburp-darwin-amd64 ./cmd/agentburp
          
          # macOS Apple Silicon (Darwin ARM64)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/agentburp-darwin-arm64 ./cmd/agentburp

      - name: Build NSIS Windows Setup Installer
        run: |
          sudo apt-get update && sudo apt-get install -y nsis
          makensis installer/agentburp.nsi

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "agentburp ${{ github.event.inputs.tag_name || github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/agentburp-setup.exe
            dist/agentburp.exe
            dist/agentburp-windows-amd64.exe
            dist/agentburp-linux-amd64
            dist/agentburp-linux-arm64
            dist/agentburp-darwin-amd64
            dist/agentburp-darwin-arm64
            dist/checksums.txt
